[Service]
ExecStart=
ExecStart=/opt/dell-broadcom-fingerprint-helper/bin/fprintd
Environment=LD_LIBRARY_PATH=/opt/dell-broadcom-fingerprint-helper/lib
Environment=FP_TOD_DRIVERS_DIR=/opt/dell-broadcom-fingerprint-helper/lib/libfprint-2/tod-1

# Firmware references travel with the stack and are exposed read-only where the
# plugin expects them, so no distribution Broadcom package is required. install.sh
# creates /var/lib/fprint/fw first: with ProtectSystem=strict systemd cannot
# create the mount point inside the unit namespace.
BindReadOnlyPaths=/opt/dell-broadcom-fingerprint-helper/share/fw:/var/lib/fprint/fw

# Fedora ships fprintd.service hardened (MemoryDenyWriteExecute=true and a
# SystemCallFilter allowlist). The proprietary plugin is only validated against
# the unhardened daemon Ubuntu ships, so both directives are relaxed to match
# that reference environment. Everything else (DeviceAllow=char-usb_device,
# StateDirectory=fprint, ProtectSystem=strict) is kept.
MemoryDenyWriteExecute=false
SystemCallFilter=
